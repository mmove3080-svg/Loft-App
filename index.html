<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>Home</title>
<meta name="description" content="An iOS-style Home Screen, rebuilt for the web.">
<meta name="theme-color" content="#0b0f14">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Home">
<style>
/* ============================ tokens ============================ */
:root{
  --sw:400px;            /* stage width  */
  --colw:70px;           /* grid column  */
  --gap:14px;            /* grid gutter  */
  --rowh:68px;           /* grid row     */
  --icon:62px;           /* dock icon    */
  --r-widget:24px;
  --r-icon:22.6%;
  --statush:44px;
  --ease:cubic-bezier(.32,.72,0,1);
  --label:15px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --blue:#0a84ff; --green:#34c759; --red:#ff453a; --yellow:#ffd60a;
  --sep:rgba(255,255,255,.11);
  --fill1:rgba(120,120,128,.24);
  --label2:rgba(235,235,245,.6);
  --label3:rgba(235,235,245,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font);
  background:#0a0d11;color:#fff;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:2px;border-radius:6px}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ============================ wallpaper ============================ */
#wall{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(58% 40% at -2% 4%, rgba(158,174,198,.92), transparent 62%),
    radial-gradient(42% 34% at -8% 38%, rgba(92,116,152,.85), transparent 66%),
    radial-gradient(52% 32% at 106% 70%, rgba(122,137,163,.8), transparent 62%),
    radial-gradient(80% 26% at 46% 106%, rgba(58,74,94,.7), transparent 72%),
    radial-gradient(70% 50% at 62% 26%, rgba(6,8,10,.9), transparent 70%),
    linear-gradient(152deg,#12171d 0%,#0d1116 46%,#080b0f 100%);
  will-change:transform;
  transition:transform .42s var(--ease),filter .42s var(--ease);
}
body.app-open #wall{transform:scale(1.06);filter:brightness(.55) saturate(.9)}

/* ============================ stage ============================ */
#stage{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:transform .42s var(--ease),opacity .32s var(--ease);
  will-change:transform,opacity;
}
body.app-open #stage{transform:scale(.94);opacity:0;pointer-events:none}
#screen{width:var(--sw);height:100%;display:flex;flex-direction:column}

/* status: time only. No carrier / signal / wifi / battery. */
#status{
  height:var(--statush);flex:0 0 auto;
  display:flex;align-items:center;
  padding:0 var(--side,9%);
  font-size:clamp(13px,calc(var(--sw)*.043),19px);font-weight:600;letter-spacing:.2px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
}

#springboard{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}

/* ============================ widget grid ============================ */
#grid{
  display:grid;margin:0 auto;
  grid-template-columns:repeat(var(--cols,4),var(--colw));
  grid-auto-rows:var(--rowh);
  gap:var(--gap);
}
.widget{
  position:relative;overflow:hidden;
  border-radius:var(--r-widget);
  background:rgba(22,25,30,.62);
  -webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);
  box-shadow:0 12px 28px rgba(0,0,0,.42),0 1px 0 rgba(255,255,255,.07) inset,0 0 0 .5px rgba(255,255,255,.06);
  contain:content;
  transform:translateZ(0);
}
.widget.tap{cursor:pointer;transition:transform .22s var(--ease)}
.widget.tap:active{transform:scale(.955)}
.w-med{grid-column:span 4;grid-row:span 2}
.w-sm{grid-column:span 2;grid-row:span 2}

/* -- weather -- */
#w-weather{background:linear-gradient(165deg,#8d99b4 0%,#6c7a97 46%,#4a5872 100%)}
#w-weather .sky{position:absolute;inset:0;width:100%;height:100%;display:block}
#w-weather .veil{position:absolute;inset:0;background:linear-gradient(102deg,rgba(34,46,68,.62) 0%,rgba(44,56,80,.24) 42%,transparent 64%),linear-gradient(180deg,rgba(255,255,255,.06),transparent 40%)}
.wx{position:absolute;inset:0;padding:calc(var(--colw)*.228);display:flex;flex-direction:column;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.wx .city{font-size:calc(var(--colw)*.26);font-weight:600;letter-spacing:.1px}
.wx .temp{font-size:calc(var(--colw)*.678);font-weight:300;line-height:1.02;margin-top:calc(var(--colw)*.033);letter-spacing:-.02em}
.wx .cond{font-size:calc(var(--colw)*.249);font-weight:600;margin-top:auto}
.wx .sun{width:calc(var(--colw)*.336);height:calc(var(--colw)*.336);margin-bottom:calc(var(--colw)*.065)}

/* -- clock -- */
#w-clock{background:rgba(18,18,20,.78)}
.clock-svg{position:absolute;inset:8%;width:84%;height:84%}
.cl-face{fill:#131315}
.cl-num{fill:#e9e9ee;font-size:8.6px;font-weight:500;text-anchor:middle;dominant-baseline:central;font-family:var(--font)}
.cl-tick{stroke:rgba(255,255,255,.72);stroke-linecap:round}
.cl-tick.minor{stroke:rgba(255,255,255,.3)}
.cl-hand{stroke:#fff;stroke-linecap:round;transform-origin:50px 50px}
.cl-sec{stroke:#ff9f0a;stroke-linecap:round;transform-origin:50px 50px}
.cl-hand,.cl-sec{transition:transform .12s var(--ease)}
.cl-hand.jump,.cl-sec.jump{transition:none}

/* -- calendar -- */
#w-cal{background:rgba(20,20,22,.8)}
.cal{position:absolute;inset:0;padding:calc(var(--colw)*.152) calc(var(--colw)*.163);display:flex;flex-direction:column}
.cal .dow{color:#ff453a;font-size:calc(var(--colw)*.2);font-weight:700;letter-spacing:.4px;line-height:1.15}
.cal .day{font-size:calc(var(--colw)*.531);font-weight:600;line-height:1.02;letter-spacing:-.02em;margin-bottom:calc(var(--colw)*.043)}
.cal table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal td{text-align:center;font-size:calc(var(--colw)*.168);font-weight:500;color:rgba(255,255,255,.92);padding:calc(var(--colw)*.03) 0;line-height:1.1;position:relative}
.cal td.mute{color:rgba(255,255,255,.32)}
.cal td.today span{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--colw)*.255);height:calc(var(--colw)*.255);border-radius:50%;background:#ff3b30;color:#fff;font-weight:600;margin:calc(var(--colw)*-.022) 0}

/* -- battery / device -- */
#w-batt{background:rgba(22,22,24,.76)}
.batt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--colw)*.141)}
.batt svg{width:46%;height:46%}
.batt .lbl{font-size:calc(var(--colw)*.228);font-weight:600;letter-spacing:-.01em}

/* -- photos widget -- */
#w-photos{background:#111}
.pw-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.5px}
.pw-grid i{display:block;background-size:cover;background-position:center}
.pw-bar{
  position:absolute;left:calc(var(--colw)*.119);right:calc(var(--colw)*.119);bottom:calc(var(--colw)*.119);
  height:calc(var(--colw)*.46);border-radius:999px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 calc(var(--colw)*.184);
  background:rgba(20,20,22,.5);
  -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  font-size:calc(var(--colw)*.206);font-weight:600;
}
.pw-bar span{display:inline-flex;align-items:center;gap:calc(var(--colw)*.098);white-space:nowrap}
.pw-bar svg{width:calc(var(--colw)*.228);height:calc(var(--colw)*.228);flex:0 0 auto}

/* ============================ dock ============================ */
#dockwrap{flex:0 0 auto;display:flex;justify-content:center;padding-bottom:min(calc(var(--sw)*.018),18px)}
#dock{
  display:flex;align-items:center;gap:var(--dockgap,18px);
  padding:calc(var(--icon)*.3) calc(var(--icon)*.3);
  border-radius:calc(var(--icon)*.42);
  background:rgba(120,132,150,.2);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  box-shadow:0 0 0 .5px rgba(255,255,255,.09) inset,0 10px 30px rgba(0,0,0,.3);
}
.appicon{
  position:relative;width:var(--icon);height:var(--icon);
  border-radius:var(--r-icon);overflow:hidden;flex:0 0 auto;
  box-shadow:0 6px 14px rgba(0,0,0,.34),0 0 0 .5px rgba(0,0,0,.18);
  transition:transform .2s var(--ease),opacity .2s var(--ease);
  display:block;
}
.appicon svg{display:block;width:100%;height:100%}
.appicon:active{transform:scale(.9);opacity:.85}
@media (hover:hover){.appicon:hover{transform:scale(1.045)}.appicon:active{transform:scale(.92)}}
.appicon.launching{opacity:0}

#homebar{flex:0 0 auto;height:var(--homebar,26px);display:flex;align-items:center;justify-content:center}
#homebar i{display:block;width:min(calc(var(--sw)*.35),168px);height:5px;border-radius:3px;background:rgba(255,255,255,.9)}

/* ======================= theme surfaces (light default) ================== */
:root{
  --pg:#f4f4f6; --card:#fff; --ink:#0d1b2a; --ink2:#4a5763; --ink3:#8a94a0;
  --line:rgba(0,0,0,.08); --gold:#b8892b; --navy:#12263f;
}
body.dark{
  --pg:#000; --card:#1c1c1e; --ink:#fff; --ink2:rgba(235,235,245,.62); --ink3:rgba(235,235,245,.32);
  --line:rgba(255,255,255,.11); --gold:#d8a33f; --navy:#dfe6ee;
}
#dim{position:fixed;inset:0;z-index:9000;background:#000;opacity:0;pointer-events:none;transition:opacity .18s linear}

/* ============================== article ================================= */
#article{
  position:fixed;inset:0;z-index:40;background:var(--pg);color:var(--ink);
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transition:opacity .34s var(--ease),transform .34s var(--ease);
}
#article[hidden]{display:none}
#article.leaving{opacity:0;transform:scale(.97)}
.art{max-width:1040px;margin:0 auto;padding:0 clamp(14px,3.4vw,26px) 40px}
.art-hero{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:clamp(22px,5vw,40px) 0 clamp(16px,3vw,26px);text-align:center}
.art-hero h1{
  margin:0;font-size:clamp(30px,7.4vw,62px);line-height:.98;font-weight:800;
  letter-spacing:-.02em;color:var(--navy);text-transform:uppercase;
}
.art-hero h2{
  margin:6px 0 0;font-size:clamp(12px,2.6vw,22px);font-weight:700;color:var(--gold);
  letter-spacing:.16em;text-transform:uppercase;
}
.art-hero p{margin:14px auto 0;max-width:62ch;font-size:clamp(13px,2.5vw,16px);line-height:1.5;color:var(--ink2)}
.art-hero .por{
  width:clamp(74px,17vw,132px);aspect-ratio:1;border-radius:50%;margin:0 auto 4px;
  background:linear-gradient(150deg,#1c3f6e,#0d1b2a);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(13,27,42,.28);
}
.art-hero .por span{font-size:clamp(22px,5vw,38px);font-weight:800;color:#fff;letter-spacing:-.02em}
.art-hero .por img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* timeline */
.tl{position:relative;padding-left:clamp(26px,6vw,46px)}
.tl::before{
  content:"";position:absolute;left:clamp(9px,2.2vw,17px);top:18px;bottom:22px;width:2px;
  background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 12px);
}
.tl-item{position:relative;margin-bottom:clamp(10px,2vw,14px)}
.tl-dot{
  position:absolute;left:calc(clamp(26px,6vw,46px) * -1);top:clamp(14px,3vw,24px);
  width:clamp(20px,4.4vw,30px);height:clamp(20px,4.4vw,30px);border-radius:50%;
  background:var(--navy);color:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:clamp(10px,2.2vw,14px);font-weight:700;z-index:1;
  transform:translateX(calc(clamp(20px,4.4vw,30px) / -2 + clamp(10px,2.2vw,18px)));
}
.tl-card{
  display:grid;grid-template-columns:clamp(78px,20vw,150px) minmax(0,1fr);
  gap:clamp(10px,2.4vw,18px);align-items:stretch;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:clamp(8px,1.6vw,12px);box-shadow:0 1px 3px rgba(0,0,0,.05);
  transition:box-shadow .2s,transform .2s var(--ease);
}
.tl-img{
  position:relative;border-radius:9px;overflow:hidden;min-height:clamp(84px,22vw,150px);
  background:linear-gradient(155deg,var(--c1),var(--c2));
  display:flex;align-items:center;justify-content:center;
}
.tl-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
.tl-img .mono{font-size:clamp(20px,5vw,34px);font-weight:800;color:rgba(255,255,255,.5);letter-spacing:-.02em}
.tl-body{display:flex;flex-direction:column;gap:clamp(5px,1vw,7px);min-width:0;padding:clamp(3px,1vw,6px) clamp(2px,1vw,6px) clamp(3px,1vw,6px) 0}
.tl-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.crest{
  width:clamp(26px,6.4vw,44px);height:clamp(26px,6.4vw,44px);flex:0 0 auto;border-radius:8px 8px 14px 14px;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(9px,2.1vw,13px);font-weight:800;color:#fff;letter-spacing:-.01em;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);
}
.tl-club{font-size:clamp(14px,3.4vw,23px);font-weight:800;letter-spacing:-.01em;text-transform:uppercase;color:var(--club,var(--navy))}
.tl-years{
  font-size:clamp(9px,2vw,12.5px);font-weight:700;color:#fff;background:var(--club,var(--navy));
  padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em;
}
.tl-text{margin:0;font-size:clamp(11.5px,2.5vw,15px);line-height:1.45;color:var(--ink2)}
.tl-stats{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(6px,1.6vw,10px);margin-top:auto;padding-top:3px}
.tl-stat{display:flex;align-items:center;gap:5px;font-size:clamp(10.5px,2.2vw,13.5px);font-weight:600;color:var(--ink)}
.tl-stat svg{width:clamp(12px,2.8vw,17px);height:clamp(12px,2.8vw,17px);flex:0 0 auto}
.tl-stat+.tl-stat::before{content:"";width:1px;height:14px;background:var(--line);margin-right:clamp(1px,1vw,5px)}

/* footer stat strip */
.art-foot{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(10px,2.4vw,20px);
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:clamp(12px,2.6vw,20px);margin-top:clamp(10px,2vw,16px);
}
.fs{display:flex;gap:10px;align-items:flex-start}
.fs svg{width:clamp(24px,5vw,34px);height:clamp(24px,5vw,34px);flex:0 0 auto}
.fs .k{font-size:clamp(9px,1.9vw,11px);font-weight:700;letter-spacing:.09em;color:var(--ink3);text-transform:uppercase}
.fs .v{font-size:clamp(20px,4.4vw,30px);font-weight:800;line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
.fs .n{font-size:clamp(10px,2vw,12px);color:var(--ink2);line-height:1.35;margin-top:2px}
.art-note{text-align:center;font-size:clamp(9.5px,1.9vw,11.5px);color:var(--ink3);line-height:1.5;padding:16px 4px 0}

/* ============================== lock screen ============================= */
#lock{
  position:fixed;inset:0;z-index:60;background:var(--pg);color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;transition:opacity .26s var(--ease);
}
#lock[hidden]{display:none}
#lock.on{opacity:1}
.lockbox{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.lockbox h2{margin:0;font-size:clamp(19px,4.6vw,26px);font-weight:700;letter-spacing:-.02em;line-height:1.25;color:var(--ink)}
.lockbox input{
  width:100%;text-align:center;font-size:24px;letter-spacing:.32em;font-weight:600;
  padding:14px 12px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);outline:none;font-variant-numeric:tabular-nums;
}
.lockbox input:focus{border-color:#0a84ff;box-shadow:0 0 0 3px rgba(10,132,255,.18)}
.lockbox button{
  width:100%;padding:13px;border-radius:14px;background:#0a84ff;color:#fff;
  font-size:17px;font-weight:600;
}
.lockbox button:active{filter:brightness(.86)}
.lockbox button[disabled]{opacity:.45}
.lockbox .back{background:none;color:var(--ink3);font-size:14px;font-weight:500;padding:2px}
.shake{animation:shk .34s}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ============================== settings ================================ */
.settings{background:var(--pg);color:var(--ink)}
.settings .nav{background:var(--card);border-bottom:1px solid var(--line);color:var(--ink)}
.settings .scroll{background:var(--pg)}
.set-title{font-size:clamp(28px,7vw,34px);font-weight:800;letter-spacing:-.025em;padding:8px 18px 14px;color:var(--ink)}
.set-grp{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;padding:16px 20px 7px}
.set-card{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
@media (min-width:520px){.set-card{margin:0 16px;border-radius:12px;border:1px solid var(--line)}}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;min-height:52px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .ic{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.set-row .ic svg{width:23px;height:23px}
.set-row .lb{flex:1;font-size:16.5px;color:var(--ink);min-width:0}
.set-row .val{font-size:16px;color:var(--ink3);flex:0 0 auto}
.set-row .act{font-size:16px;color:#0a84ff;flex:0 0 auto;font-weight:500}
.set-row .act.danger{color:#ff3b30}
button.set-row:active{background:rgba(120,120,128,.12)}
.set-foot{font-size:12.5px;line-height:1.45;color:var(--ink3);padding:10px 20px 22px}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.24);position:relative;flex:0 0 auto;transition:background .22s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.28);transition:transform .22s var(--ease)}
.sw.on{background:#34c759}
.sw.on::after{transform:translateX(20px)}
.slider{flex:1;min-width:90px;display:flex;align-items:center}
.slider input{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:rgba(120,120,128,.28);outline:none}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.slider input::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.slider input::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#0a84ff var(--pct,100%),rgba(120,120,128,.28) var(--pct,100%))}

/* modal sheet used by settings dialogs */
.sheet{position:absolute;inset:0;z-index:7;background:var(--pg);display:flex;flex-direction:column;color:var(--ink)}
.sheet .nav{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
.sheet .form{padding:18px 18px 8px;display:flex;flex-direction:column;gap:10px}
.sheet .form input{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:17px;outline:none;letter-spacing:.16em;text-align:center;
}
.sheet .form input:focus{border-color:#0a84ff}
.sheet .hint{font-size:13px;color:var(--ink3);line-height:1.45;padding:2px 2px 0;text-align:center;letter-spacing:0}
.sheet .err{font-size:13.5px;color:#ff3b30;text-align:center;min-height:18px;letter-spacing:0}
.sheet .go{margin:8px 0 0;padding:13px;border-radius:13px;background:#0a84ff;color:#fff;font-size:17px;font-weight:600}
.sheet .go[disabled]{opacity:.4}
.sheet .go.danger{background:#ff3b30}

/* ============================== calculator ============================== */
.calculator{background:#000;color:#fff}
.calculator{--pad:#333;--padtxt:#fff;--top:#a5a5a5;--toptxt:#000;--op:#ff9f0a}
.calc-out{
  flex:0 0 auto;padding:14px 20px 10px;text-align:right;font-weight:300;
  font-size:clamp(46px,15vw,76px);line-height:1.05;letter-spacing:-.02em;
  overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums;min-height:1.15em;
}
.calc-keys{
  flex:0 0 auto;display:grid;gap:clamp(8px,2.4vw,13px);
  grid-template-columns:repeat(4,1fr);padding:0 clamp(10px,3.4vw,18px) clamp(10px,3vw,16px);
}
.ck{
  aspect-ratio:1;border-radius:999px;background:var(--pad);color:var(--padtxt);
  font-size:clamp(22px,7vw,34px);font-weight:400;display:flex;align-items:center;justify-content:center;
  transition:filter .12s;
}
.ck:active{filter:brightness(1.5)}
.ck.top{background:var(--top);color:var(--toptxt);font-weight:500}
.ck.op{background:var(--op);color:#fff;font-size:clamp(26px,8vw,40px)}
.ck.op.armed{background:#fff;color:var(--op)}
.ck.zero{aspect-ratio:auto;grid-column:span 2;justify-content:flex-start;padding-left:9%}
.calc-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;max-width:520px;margin:0 auto;width:100%}

/* home-screen app icons living inside the widget grid */
.gridapps{display:flex;align-items:flex-start;gap:var(--gap);padding-top:2px}
.gicon{display:flex;flex-direction:column;align-items:center;gap:5px;width:var(--colw)}
.gicon .appicon{width:var(--colw);height:var(--colw)}
.gicon:active .appicon{transform:scale(.9);opacity:.85}
.gicon .lab{
  font-size:clamp(9px,calc(var(--colw)*.175),13px);font-weight:400;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;letter-spacing:.01em;
}

/* ============================ app layer ============================ */
#applayer{position:fixed;inset:0;z-index:20;pointer-events:none}
.appwin{
  position:absolute;inset:0;pointer-events:auto;
  background:#000;color:#fff;overflow:hidden;
  display:flex;flex-direction:column;
  will-change:transform,opacity,border-radius;
  transform-origin:50% 50%;
}
.appwin>.appbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.appinner{
  width:100%;max-width:var(--appmax,560px);margin:0 auto;
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative;
}
.appfade{opacity:0;transition:opacity .18s linear .06s}
.appwin.ready .appfade{opacity:1}
.appwin .safetop{height:env(safe-area-inset-top)}
.apphome{flex:0 0 auto;height:24px;display:flex;align-items:center;justify-content:center;background:transparent;width:100%}
.apphome i{display:block;width:min(140px,34%);height:5px;border-radius:3px;background:rgba(255,255,255,.55);transition:background .16s,transform .16s}
.apphome:hover i{background:rgba(255,255,255,.95)}
.apphome:active i{transform:scaleX(.86);background:#fff}
.appwin .safebot{height:max(env(safe-area-inset-bottom),8px)}

/* nav bar */
.nav{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:6px 14px 8px;min-height:46px;
  background:rgba(20,20,22,.72);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border-bottom:.5px solid var(--sep);
  position:relative;z-index:3;
}
.nav .title{font-size:17px;font-weight:600;letter-spacing:-.01em;position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.nav .btn{font-size:17px;color:var(--tint,var(--blue));display:inline-flex;align-items:center;gap:3px;padding:4px 2px;border-radius:8px;position:relative;z-index:1}
.nav .btn:active{opacity:.5}
.nav .btn.strong{font-weight:600}
.nav .spacer{flex:1}
.nav .btn svg{width:11px;height:19px}
.bigtitle{font-size:34px;font-weight:700;letter-spacing:-.02em;padding:6px 16px 10px}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 28px;text-align:center;color:var(--label2)}
.empty h3{margin:0;font-size:20px;font-weight:600;color:#fff}
.empty p{margin:0;font-size:15px;line-height:1.4;max-width:30ch}
.empty svg{width:52px;height:52px;opacity:.45;margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:999px;background:var(--tint,var(--blue));color:#fff;font-size:16px;font-weight:600;margin-top:6px}
.pill:active{filter:brightness(.85)}
.pill.ghost{background:var(--fill1);color:var(--tint,var(--blue))}
.toast{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
  background:rgba(40,40,44,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  color:#fff;font-size:14px;padding:10px 16px;border-radius:14px;z-index:9;
  opacity:0;transition:opacity .2s,transform .2s var(--ease);max-width:80%;text-align:center;pointer-events:none;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================ photos ============================ */
.photos{--tint:var(--blue)}
.ph-sec{padding:2px 0 14px}
.ph-sec h4{margin:0;padding:12px 14px 8px;font-size:19px;font-weight:700;letter-spacing:-.01em;position:sticky;top:0;background:linear-gradient(#000 62%,rgba(0,0,0,.75));z-index:2;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ph-grid{display:grid;grid-template-columns:repeat(var(--phcols,3),1fr);gap:2px;padding:0 2px}
.ph-cell{position:relative;aspect-ratio:1;background:#161618;overflow:hidden;display:block;contain:strict}
.ph-cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .18s}
.ph-cell img.on{opacity:1}
.ph-cell .badge{position:absolute;right:5px;bottom:4px;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.ph-cell .badge svg{width:12px;height:12px}
.ph-cell .na{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:10px;color:var(--label2);padding:6px;text-align:center;line-height:1.2}
.ph-cell .check{position:absolute;right:5px;top:5px;width:21px;height:21px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:rgba(0,0,0,.22);display:none;align-items:center;justify-content:center}
.photos.selecting .ph-cell .check{display:flex}
.ph-cell.sel img{transform:scale(.9);transition:transform .15s var(--ease)}
.ph-cell.sel .check{background:var(--blue);border-color:var(--blue)}
.ph-cell .check svg{width:12px;height:12px;opacity:0}
.ph-cell.sel .check svg{opacity:1}
.ph-toolbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-top:.5px solid var(--sep);background:rgba(20,20,22,.72);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.ph-toolbar .btn{font-size:16px;color:var(--blue)}
.ph-toolbar .btn.danger{color:var(--red)}
.ph-toolbar .btn[disabled]{color:var(--label3)}

/* viewer */
.viewer{position:absolute;inset:0;background:#000;z-index:8;display:flex;flex-direction:column;opacity:0;transition:opacity .2s}
.viewer.on{opacity:1}
.viewer .vtop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 14px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent);transition:opacity .2s}
.viewer .vbot{position:absolute;bottom:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 20px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.6));transition:opacity .2s}
.viewer.chromeless .vtop,.viewer.chromeless .vbot{opacity:0;pointer-events:none}
.viewer .stagearea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.viewer img,.viewer video{max-width:100%;max-height:100%;display:block;object-fit:contain}
.viewer .arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(30,30,32,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:2}
@media (hover:hover) and (pointer:fine){.viewer .arrow{display:flex}}
.viewer .arrow.prev{left:14px}.viewer .arrow.next{right:14px}
.viewer .arrow svg{width:14px;height:24px}
.viewer .meta{font-size:13px;color:var(--label2)}
.viewer .icobtn{width:34px;height:34px;border-radius:50%;background:rgba(40,40,44,.6);display:flex;align-items:center;justify-content:center}
.viewer .icobtn svg{width:14px;height:14px}

/* ============================ notes ============================ */
.notes{--tint:#ffd60a;background:#000}
.nt-search{padding:6px 14px 10px}
.nt-search input{width:100%;border:0;border-radius:11px;background:var(--fill1);padding:9px 12px 9px 32px;font-size:16px;color:#fff}
.nt-search{position:relative}
.nt-search svg{position:absolute;left:24px;top:16px;width:14px;height:14px;opacity:.5}
.nt-list{padding:0 14px 20px}
.nt-item{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:12px;background:rgba(28,28,30,.9);margin-bottom:2px}
.nt-item+.nt-item{border-top:.5px solid var(--sep)}
.nt-item .t{font-size:16px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-item .s{font-size:14px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-item .s b{color:rgba(235,235,245,.85);font-weight:400;margin-right:6px}
.nt-item:active{background:rgba(44,44,46,.95)}
.nt-editor{flex:1;display:flex;flex-direction:column;min-height:0}
.nt-editor textarea{flex:1;width:100%;border:0;background:#000;color:#fff;padding:12px 16px 24px;font-size:17px;line-height:1.45;resize:none;outline:none}
.nt-count{flex:0 0 auto;text-align:center;font-size:12px;color:var(--label3);padding:6px 0 10px}
.nt-fab{position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.nt-fab svg{width:22px;height:22px;color:var(--yellow)}
.nt-fab:active{transform:scale(.94)}

/* ============================ phone ============================ */
.phone{--tint:var(--green);background:#000}
.tabbar{flex:0 0 auto;display:flex;border-top:.5px solid var(--sep);background:rgba(20,20,22,.78);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:10px;font-weight:500;color:var(--label2)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--green)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:.5px solid var(--sep);width:100%;text-align:left}
.row:active{background:rgba(255,255,255,.06)}
.row .av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:linear-gradient(160deg,#8e8e93,#636366);color:#fff}
.row .grow{flex:1;min-width:0}
.row .n{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .r{font-size:13px;color:var(--label2);flex:0 0 auto}
.row .n.missed{color:var(--red)}
.keypad{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 8px;gap:6px}
.kp-display{min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:0 20px}
.kp-display .num{font-size:34px;font-weight:400;letter-spacing:.5px;white-space:nowrap;overflow:hidden;direction:rtl;text-overflow:ellipsis}
.kp-display .del{opacity:0;transition:opacity .15s}
.kp-display .del.on{opacity:1}
.kp-display .del svg{width:26px;height:20px;opacity:.8}
.kp-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 26px;padding:6px 0}
.kp-key{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.kp-key:active{background:rgba(255,255,255,.28)}
.kp-key b{font-size:31px;font-weight:400;line-height:1}
.kp-key i{font-size:9.5px;font-style:normal;letter-spacing:1.4px;font-weight:600;color:var(--label2)}
.kp-call{width:70px;height:70px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:2px 0 4px}
.kp-call svg{width:30px;height:30px}
.kp-call[disabled]{opacity:.35}
.callscreen{position:absolute;inset:0;z-index:6;background:linear-gradient(170deg,#25303c,#0f1418);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 54px) 20px calc(env(safe-area-inset-bottom) + 40px)}
.callscreen .cn{font-size:32px;font-weight:400;letter-spacing:-.01em;text-align:center}
.callscreen .cs{font-size:16px;color:var(--label2);margin-top:8px;font-variant-numeric:tabular-nums}
.callscreen .note{margin-top:auto;font-size:13px;color:var(--label2);text-align:center;line-height:1.4;max-width:32ch;margin-bottom:18px}
.callscreen .end{width:72px;height:72px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center}
.callscreen .end svg{width:32px;height:32px;transform:rotate(134deg)}
.addform{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.addform input{width:100%;border:0;border-radius:11px;background:var(--fill1);padding:11px 13px;font-size:16px}

/* ============================ messages ============================ */
.messages{--tint:var(--blue);background:#000}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.bubbles{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.bub{max-width:74%;padding:8px 13px;border-radius:19px;font-size:16.5px;line-height:1.32;word-wrap:break-word;white-space:pre-wrap;position:relative}
.bub.me{align-self:flex-end;background:linear-gradient(#2b9bff,#0a84ff);color:#fff;border-bottom-right-radius:7px}
.bub.you{align-self:flex-start;background:#26262a;color:#fff;border-bottom-left-radius:7px}
.bub+.bub.me{margin-top:1px}
.daysep{align-self:center;font-size:11px;color:var(--label2);padding:10px 0 6px;font-weight:600}
.composer{flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px 12px;border-top:.5px solid var(--sep);background:rgba(20,20,22,.8);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.composer textarea{flex:1;max-height:110px;min-height:36px;border:.5px solid rgba(255,255,255,.16);border-radius:18px;background:transparent;padding:8px 12px;font-size:16.5px;line-height:1.3;resize:none;outline:none}
.composer .send{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-bottom:2px;transition:opacity .15s,transform .15s}
.composer .send svg{width:16px;height:16px}
.composer .send[disabled]{opacity:.3;transform:scale(.9)}
.chat-head{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 12px;border-bottom:.5px solid var(--sep)}
.chat-head .av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;background:linear-gradient(160deg,#8e8e93,#636366)}
.chat-head .nm{font-size:13px;font-weight:500}
.localnote{font-size:11.5px;color:var(--label3);text-align:center;padding:8px 24px 2px;line-height:1.35}

/* ============================ responsive ============================ */
@media (min-width:900px){
  .appwin{border-radius:0}
  .nav{padding-left:20px;padding-right:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  #wall{transition:none}
}
</style>
</head>
<body>
<div id="wall" aria-hidden="true"></div>

<div id="stage">
  <div id="screen">
    <div id="status"><span id="clocktext">--:--</span></div>

    <div id="springboard">
      <div id="grid">
        <!-- Calculator + Settings (this row replaced the Weather widget) -->
        <div class="gridapps" id="w-apps">
          <button class="gicon" data-open="calculator" aria-label="Open Calculator">
            <span class="appicon" id="ico-calc"></span><span class="lab">Calculator</span>
          </button>
          <button class="gicon" data-open="settings" aria-label="Open Settings">
            <span class="appicon" id="ico-set"></span><span class="lab">Settings</span>
          </button>
        </div>

        <!-- Clock -->
        <div class="widget w-sm" id="w-clock" role="img" aria-label="Analog clock">
          <svg class="clock-svg" viewBox="0 0 100 100" id="clocksvg" aria-hidden="true">
            <circle class="cl-face" cx="50" cy="50" r="49"></circle>
            <circle cx="50" cy="50" r="48.4" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"></circle>
            <g id="cl-ticks"></g><g id="cl-nums"></g>
            <line class="cl-hand" id="cl-hour" x1="50" y1="50" x2="50" y2="27" stroke-width="4.4"></line>
            <line class="cl-hand" id="cl-min" x1="50" y1="50" x2="50" y2="16" stroke-width="3.4"></line>
            <line class="cl-sec" id="cl-sec" x1="50" y1="57" x2="50" y2="18" stroke-width="1.5"></line>
            <circle cx="50" cy="50" r="2.6" fill="#ff9f0a"></circle>
            <circle cx="50" cy="50" r="1" fill="#131315"></circle>
          </svg>
        </div>

        <!-- Calendar -->
        <div class="widget w-sm" id="w-cal" role="img" aria-label="Calendar">
          <div class="cal">
            <div class="dow" id="cal-dow">MONDAY</div>
            <div class="day" id="cal-day">10</div>
            <table id="cal-grid"><tbody></tbody></table>
          </div>
        </div>

        <!-- Device battery -->
        <div class="widget w-sm" id="w-batt" role="img" aria-label="iPad battery, 100 percent">
          <div class="batt">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="7"></circle>
              <circle cx="50" cy="50" r="38" fill="none" stroke="#30d158" stroke-width="7" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="0" transform="rotate(-90 50 50)"></circle>
              <rect x="39" y="30" width="22" height="40" rx="5" fill="none" stroke="#fff" stroke-width="3"></rect>
              <rect x="45" y="33.5" width="10" height="1.6" rx="0.8" fill="#fff" opacity=".8"></rect>
            </svg>
            <div class="lbl">iPad · 100%</div>
          </div>
        </div>

        <!-- Photos -->
        <div class="widget w-med tap" id="w-photos" data-open="photos" role="button" tabindex="0" aria-label="Photos widget, open Photos">
          <div class="pw-grid" id="pw-grid"></div>
          <div class="pw-bar">
            <span><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 20.6s-8.4-5-8.4-10.6A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8.4 2.8c0 5.6-8.4 10.6-8.4 10.6z"/></svg><em style="font-style:normal" id="pw-count">Featured · 12 photos</em></span>
            <span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.4"/><path d="M16 16l4.4 4.4"/></svg>Search</span>
          </div>
        </div>
      </div>
    </div>

    <div id="dockwrap"><div id="dock" role="list"></div></div>
    <div id="homebar"><i></i></div>
  </div>
</div>

<div id="article" hidden></div>

function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n}

var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DAYS=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];

function fmtTime(d){
  var h=d.getHours(),m=d.getMinutes();
  var h12=h%12; if(h12===0)h12=12;
  return h12+':'+(m<10?'0':'')+m;
}
function fmtClock(ts){
  var d=new Date(ts),now=new Date();
  if(d.toDateString()===now.toDateString())return fmtTime(d)+' '+(d.getHours()<12?'AM':'PM');
  var y=new Date(now.getTime()-864e5);
  if(d.toDateString()===y.toDateString())return 'Yesterday';
  if(now-d < 6*864e5) return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2);
}
function dayHeading(ts){
  var d=new Date(ts),now=new Date();
  if(d.toDateString()===now.toDateString())return 'Today';
  var y=new Date(now.getTime()-864e5);
  if(d.toDateString()===y.toDateString())return 'Yesterday';
  return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function bytes(n){
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(0)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
function dur(s){s=Math.round(s||0);var m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60)}

/* ------------------------------- storage --------------------------------- */
/* IndexedDB for media + records; a memory shim if IDB is unavailable. */
var DBNAME='home-screen', DBVER=1, STORES=['media','notes','chats','contacts','kv'], dbp=null, memfall=null;

function openDB(){
  if(dbp)return dbp;
  dbp=new Promise(function(res,rej){
    var r;
    try{ r=indexedDB.open(DBNAME,DBVER); }catch(e){ return rej(e); }
    r.onupgradeneeded=function(){
      var d=r.result;
      STORES.forEach(function(n){
        if(!d.objectStoreNames.contains(n)){
          var s=d.createObjectStore(n,{keyPath:n==='kv'?null:'id'});
          if(n==='media')s.createIndex('createdAt','createdAt');
        }
      });
    };
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){rej(r.error)};
    r.onblocked=function(){rej(new Error('blocked'))};
  }).catch(function(){ memfall=memfall||{}; STORES.forEach(function(n){memfall[n]=new Map()}); return null; });
  return dbp;
}
function reqp(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
var DB={
  all:function(n){return openDB().then(function(d){
    if(!d)return Array.from(memfall[n].values());
    return reqp(d.transaction(n,'readonly').objectStore(n).getAll());
  }).catch(function(){return []})},
  get:function(n,k){return openDB().then(function(d){
    if(!d)return memfall[n].get(k);
    return reqp(d.transaction(n,'readonly').objectStore(n).get(k));
  }).catch(function(){return undefined})},
  put:function(n,v,k){return openDB().then(function(d){
    if(!d){memfall[n].set(k!=null?k:v.id,v);return v}
    var t=d.transaction(n,'readwrite');
    return reqp(k!=null?t.objectStore(n).put(v,k):t.objectStore(n).put(v));
  }).catch(function(){return null})},
  del:function(n,k){return openDB().then(function(d){
    if(!d){memfall[n].delete(k);return}
    return reqp(d.transaction(n,'readwrite').objectStore(n).delete(k));
  }).catch(function(){})}
};

/* ------------------------------ layout engine ---------------------------- */
var stage=$('#stage'), grid=$('#grid'), screenEl=$('#screen');
var LAYOUT={mode:null,landscape:false,sw:400};

function layout(){
  var vw=Math.round(window.innerWidth), vh=Math.round(window.innerHeight);
  var ratio=vw/vh;
  var band = ratio>1.4 && vh<560;                  // short landscape: one widget band
  var land = !band && vw>=880 && ratio>1.05;       // desktop / tablet landscape
  var sw, cols, rows, gapf, sidef, iconf, mode;

  if(band){ mode='band'; sw=Math.min(vw*0.94,1400); cols=14; rows=2; gapf=.0135; sidef=.03; iconf=.075; }
  else if(land){ mode='land'; sw=Math.min(vw*0.92,1160); cols=8; rows=4; gapf=.024; sidef=.045; iconf=.082; }
  else if(vw>=700){ mode='tablet'; sw=Math.min(vw*0.9, vh*0.62, 820); cols=6; rows=6; gapf=.028; sidef=.06; iconf=.112; }
  else { mode='phone'; sw=Math.min(vw, vh*0.56, 470); cols=4; rows=8; gapf=.034; sidef=.08; iconf=.155; }

  var gap=Math.round(sw*gapf), side=Math.round(sw*sidef), icon=Math.round(sw*iconf);
  var statush=Math.round(Math.min(clamp(sw*0.085,28,52), vh*0.095));

  // width-constrained column
  var colW=(sw-2*side-(cols-1)*gap)/cols;
  // height-constrained column: rows*0.965 + gaps must fit the springboard
  var dockBlock=icon+2*(icon*0.30)+sw*0.018;
  var homeBar=Math.min(clamp(sw*0.062,18,34), vh*0.062);
  var availH=vh-statush-dockBlock-homeBar-sw*0.03;
  var colH=(availH-(rows-1)*gap)/(rows*0.965);
  var colw=Math.max(28,Math.min(colW,colH));

  var r=document.documentElement.style;
  r.setProperty('--sw',sw+'px');
  r.setProperty('--cols',cols);
  r.setProperty('--gap',gap+'px');
  r.setProperty('--colw',colw+'px');
  r.setProperty('--rowh',(colw*0.965)+'px');
  r.setProperty('--icon',icon+'px');
  r.setProperty('--dockgap',Math.round(mode==='phone'?sw*0.054:icon*0.42)+'px');
  r.setProperty('--statush',statush+'px');
  r.setProperty('--side',side+'px');
  r.setProperty('--homebar',Math.round(homeBar)+'px');
  r.setProperty('--r-widget',Math.round(colw*0.30)+'px');
  r.setProperty('--appmax',(vw>=900?640:9999)+'px');

  if(mode!==LAYOUT.mode){ LAYOUT.mode=mode; placeWidgets(mode); }
  LAYOUT.landscape=land; LAYOUT.sw=sw;
}
function placeWidgets(mode){
  var w=$('#w-apps'),c=$('#w-clock'),cal=$('#w-cal'),b=$('#w-batt'),p=$('#w-photos');
  function set(n,cs,ce,rs,re){ n.style.gridColumn=cs+' / '+ce; n.style.gridRow=rs+' / '+re; }
  if(mode==='band'){
    // one horizontal band, reference reading order
    set(w,1,5,1,3); set(c,5,7,1,3); set(cal,7,9,1,3); set(b,9,11,1,3); set(p,11,15,1,3);
  }else if(mode==='land'){
    // two mediums across the top, three smalls centred beneath
    set(w,1,5,1,3);  set(p,5,9,1,3);
    set(c,2,4,3,5);  set(cal,4,6,3,5); set(b,6,8,3,5);
  }else if(mode==='tablet'){
    set(w,1,5,1,3);  set(c,5,7,1,3);
    set(p,1,5,3,5);  set(cal,5,7,3,5);
    set(b,3,5,5,7);
  }else{
    set(w,1,5,1,3);  set(c,1,3,3,5); set(cal,3,5,3,5);
    set(b,2,4,5,7);  set(p,1,5,7,9);
  }
}

function onResize(){ clearTimeout(lt); lt=setTimeout(layout,60) }
window.addEventListener('resize',onResize,{passive:true});
window.addEventListener('orientationchange',function(){setTimeout(layout,180)},{passive:true});
if(window.visualViewport)visualViewport.addEventListener('resize',onResize,{passive:true});

/* ------------------------------ live widgets ----------------------------- */
(function buildClockFace(){
  var ticks='',nums='';
  for(var i=0;i<60;i++){
    var a=i*6*Math.PI/180, major=i%5===0;
    var r1=major?38.5:40.5, r2=44;
    ticks+='<line class="cl-tick'+(major?'':' minor')+'" x1="'+(50+r1*Math.sin(a)).toFixed(2)+'" y1="'+(50-r1*Math.cos(a)).toFixed(2)+
           '" x2="'+(50+r2*Math.sin(a)).toFixed(2)+'" y2="'+(50-r2*Math.cos(a)).toFixed(2)+'" stroke-width="'+(major?1.9:0.9)+'"/>';
  }
  for(var n=1;n<=12;n++){
    var b=n*30*Math.PI/180;
    nums+='<text class="cl-num" x="'+(50+31*Math.sin(b)).toFixed(2)+'" y="'+(50-31*Math.cos(b)).toFixed(2)+'">'+n+'</text>';
  }
  $('#cl-ticks').innerHTML=ticks; $('#cl-nums').innerHTML=nums;
})();

var hourH=$('#cl-hour'),minH=$('#cl-min'),secH=$('#cl-sec'),clockText=$('#clocktext');
var lastMin=-1,lastSecDeg=-1;
function tick(){
  var d=new Date();
  var s=d.getSeconds()+d.getMilliseconds()/1000;
  var m=d.getMinutes()+s/60, h=(d.getHours()%12)+m/60;
  var sd=s*6;
  // avoid the 359->0 rewind sweep
  if(sd<lastSecDeg){secH.classList.add('jump');requestAnimationFrame(function(){secH.classList.remove('jump')})}
  lastSecDeg=sd;
  secH.style.transform='rotate('+sd+'deg)';
  minH.style.transform='rotate('+(m*6)+'deg)';
  hourH.style.transform='rotate('+(h*30)+'deg)';
  if(d.getMinutes()!==lastMin){ lastMin=d.getMinutes(); clockText.textContent=fmtTime(d); }
}
var tickTimer=null;
function startClock(){ if(tickTimer)return; tick(); tickTimer=setInterval(tick,1000) }
function stopClock(){ clearInterval(tickTimer); tickTimer=null }
document.addEventListener('visibilitychange',function(){ document.hidden?stopClock():startClock() });

function buildCalendar(){
  var now=new Date();
  $('#cal-dow').textContent=DAYS[now.getDay()];
  $('#cal-day').textContent=now.getDate();
  var y=now.getFullYear(),mo=now.getMonth();
  var first=new Date(y,mo,1), lead=first.getDay(), dim=new Date(y,mo+1,0).getDate();
  var cells=[]; for(var i=0;i<lead;i++)cells.push(null);
  for(var d=1;d<=dim;d++)cells.push(d);
  while(cells.length%7)cells.push(null);
  var weeks=[]; for(var w=0;w<cells.length;w+=7)weeks.push(cells.slice(w,w+7));
  // show 4 weeks, centred on today
  var todayWeek=Math.floor((lead+now.getDate()-1)/7);
  var start=clamp(todayWeek-2,0,Math.max(0,weeks.length-4));
  var html='';
  weeks.slice(start,start+4).forEach(function(wk){
    html+='<tr>'+wk.map(function(v){
      if(v==null)return '<td></td>';
      return v===now.getDate()?'<td class="today"><span>'+v+'</span></td>':'<td>'+v+'</td>';
    }).join('')+'</tr>';
  });
  $('#cal-grid').querySelector('tbody').innerHTML=html;
}

var PLACEHOLDERS=[
  'linear-gradient(150deg,#5fb2ff,#2b6fd6)','linear-gradient(150deg,#ffb35c,#ff5f6d)',
  'linear-gradient(150deg,#efe9db,#cbc2ae)','linear-gradient(150deg,#8c2fb0,#d0508f)',
  'linear-gradient(150deg,#2a7a52,#0e3a26)','linear-gradient(150deg,#d3dce4,#98abba)',
  'linear-gradient(150deg,#ffc400,#b96f00)','linear-gradient(150deg,#39454e,#1e262c)'
];

var pwUrls=[];
function renderPhotosWidget(items){
  var g=$('#pw-grid');
  pwUrls.forEach(URL.revokeObjectURL); pwUrls=[];
  g.textContent='';
  var pick=(items||[]).slice(0,8);
  for(var i=0;i<8;i++){
    var cell=el('i');
    var m=pick[i];
    if(m&&m.thumb){ var u=URL.createObjectURL(m.thumb); pwUrls.push(u); cell.style.backgroundImage='url('+u+')'; }
    else cell.style.background=PLACEHOLDERS[i];
    g.appendChild(cell);
  }
  var n=(items||[]).length;
  $('#pw-count').textContent = n? ('Featured · '+n+' item'+(n===1?'':'s')) : 'Featured · 12 photos';
}

var applayer=$('#applayer'), current=null;

function openApp(id,fromEl){
  if(current)return;
  var def=REG[id]; if(!def)return;
  var win=el('div','appwin '+id);
  win.setAttribute('role','dialog');
  win.setAttribute('aria-label',def.title);
  var body=el('div','appbody appfade');
  var inner=el('div','appinner');
  body.appendChild(inner); win.appendChild(body);
  var hb=el('button','apphome'); hb.innerHTML='<i></i>';
  hb.setAttribute('aria-label','Go to Home Screen'); hb.title='Home (Esc)';
  hb.addEventListener('click',function(){closeApp()});
  win.appendChild(hb);
  applayer.appendChild(win);
  document.body.classList.add('app-open');

  var api={root:inner,win:win,close:closeApp,toast:makeToast(win)};
  current={id:id,win:win,api:api,def:def,from:fromEl};
  def.mount(api);

  // FLIP from the tapped icon
  var r=fromEl?fromEl.getBoundingClientRect():null;
  if(r&&!reduceMotion&&win.animate){
    if(fromEl.classList.contains('appicon'))fromEl.classList.add('launching');
    var sx=r.width/window.innerWidth, sy=r.height/window.innerHeight;
    var ox=r.left+r.width/2-window.innerWidth/2, oy=r.top+r.height/2-window.innerHeight/2;
    win.animate([
      {transform:'translate('+ox+'px,'+oy+'px) scale('+sx+','+sy+')',borderRadius:'26%',opacity:.4},
      {transform:'none',borderRadius:'0px',opacity:1}
    ],{duration:400,easing:'cubic-bezier(.32,.72,0,1)'});
    win.classList.add('ready');
  }else{
    win.classList.add('ready');
  }
  try{ history.pushState({app:id},'','#'+id); }catch(e){}
  setTimeout(function(){ var f=win.querySelector('[data-autofocus]'); if(f)f.focus(); },260);
}

function closeApp(skipHistory){
  if(!current)return;
  var c=current; current=null;
  var win=c.win, from=c.from;
  if(c.def.unmount)try{c.def.unmount()}catch(e){}
  document.body.classList.remove('app-open');
  var done=function(){
    win.remove();
    if(from&&from.classList)from.classList.remove('launching');
  };
  if(!reduceMotion&&win.animate&&from){
    var r=from.getBoundingClientRect();
    var sx=r.width/window.innerWidth, sy=r.height/window.innerHeight;
    var ox=r.left+r.width/2-window.innerWidth/2, oy=r.top+r.height/2-window.innerHeight/2;
    win.style.pointerEvents='none';
    var a=win.animate([
      {transform:'none',borderRadius:'0px',opacity:1},
      {transform:'translate('+ox+'px,'+oy+'px) scale('+sx+','+sy+')',borderRadius:'26%',opacity:.2}
    ],{duration:340,easing:'cubic-bezier(.32,.72,0,1)'});
    a.onfinish=done; setTimeout(done,420);
  }else done();
  if(!skipHistory){ try{ if(location.hash)history.back(); }catch(e){} }
}

function makeToast(win){
  var t=el('div','toast'),timer;

var picker=$('#filepicker');
var VIDEO_RE=/^video\//, HEIC_RE=/\.(heic|heif)$/i;

function fileKind(f){
  if(VIDEO_RE.test(f.type))return 'video';
  if(/^image\//.test(f.type))return 'image';
  if(/\.(mov|mp4|m4v|webm)$/i.test(f.name))return 'video';
  return 'image';
}
function drawThumb(src,w,h){
  var max=420, sc=Math.min(1,max/Math.max(w,h));
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(h*sc));
  c.getContext('2d',{alpha:false}).drawImage(src,0,0,c.width,c.height);
  return new Promise(function(res){
    if(c.toBlob)c.toBlob(function(b){res(b)},'image/jpeg',.82);
    else res(null);
  });
}
function imageThumb(file){
  return (self.createImageBitmap?createImageBitmap(file):Promise.reject()).then(function(bmp){
    return drawThumb(bmp,bmp.width,bmp.height).then(function(b){
      var d={thumb:b,w:bmp.width,h:bmp.height}; bmp.close&&bmp.close(); return d;
    });
  }).catch(function(){
    // fall back to a decoded <img>; HEIC will usually land here and fail
    return new Promise(function(res){
      var u=URL.createObjectURL(file), im=new Image(), done=false;
      var fin=function(v){ if(done)return; done=true; URL.revokeObjectURL(u); res(v) };
      im.onload=function(){ drawThumb(im,im.naturalWidth,im.naturalHeight)
        .then(function(b){fin({thumb:b,w:im.naturalWidth,h:im.naturalHeight})})
        .catch(function(){fin({thumb:null,w:0,h:0})}) };
      im.onerror=function(){fin({thumb:null,w:0,h:0})};
      setTimeout(function(){fin({thumb:null,w:0,h:0})},6000);
      im.src=u;
    });
  });
}
function videoThumb(file){
  return new Promise(function(res){
    var u=URL.createObjectURL(file), v=document.createElement('video'), done=false;
    var fin=function(o){ if(done)return; done=true; URL.revokeObjectURL(u); v.removeAttribute('src'); res(o) };
    v.preload='metadata'; v.muted=true; v.playsInline=true;
    v.onloadedmetadata=function(){
      var d=isFinite(v.duration)?v.duration:0;
      try{ v.currentTime=Math.min(d>1?0.6:0.05, Math.max(0.05,d/2)); }catch(e){ fin({thumb:null,w:v.videoWidth,h:v.videoHeight,duration:d}) }
    };
    v.onseeked=function(){
      drawThumb(v,v.videoWidth||320,v.videoHeight||180)
        .then(function(b){fin({thumb:b,w:v.videoWidth,h:v.videoHeight,duration:v.duration})})
        .catch(function(){fin({thumb:null,w:0,h:0,duration:v.duration})});
    };
    v.onerror=function(){fin({thumb:null,w:0,h:0,duration:0})};
    setTimeout(function(){fin({thumb:null,w:0,h:0,duration:0})},7000);
    v.src=u;
  });
}
function ingest(file){
  var kind=fileKind(file);
  var job = kind==='video'?videoThumb(file):imageThumb(file);
  return job.then(function(meta){
    var rec={
      id:uid(), kind:kind, name:file.name||('Untitled.'+(kind==='video'?'mp4':'jpg')),
      type:file.type||'', size:file.size||0,
      createdAt:file.lastModified||Date.now(), addedAt:Date.now(),
      blob:file, thumb:meta.thumb||null, w:meta.w||0, h:meta.h||0,
      duration:meta.duration||0,
      readable:!!meta.thumb || !HEIC_RE.test(file.name||'')
    };
    return DB.put('media',rec).then(function(){return rec});
  });
}

REG.photos={
  title:'Photos',
  mount:function(api){
    var root=api.root, items=[], selecting=false, sel={}, io=null, urls={}, viewerState=null;

    var nav=el('div','nav');
    var selBtn=navBtn('Select'); nav.appendChild(selBtn);
    var title=el('div','title','Photos'); nav.appendChild(title);
    nav.appendChild(el('div','spacer'));
    var addBtn=navBtn('','strong',G.plus); addBtn.setAttribute('aria-label','Import photos or videos'); nav.appendChild(addBtn);
    root.appendChild(el('div','safetop')); root.appendChild(nav);

    var scroll=el('div','scroll'); root.appendChild(scroll);

    var bar=el('div','ph-toolbar'); bar.style.display='none';
    var count=el('div',null,'Select Items'); count.style.fontSize='15px';
    var delBtn=navBtn('Delete','danger'); delBtn.className='btn danger'; delBtn.disabled=true;
    bar.appendChild(count); bar.appendChild(delBtn);
    root.appendChild(bar);
    root.appendChild(el('div','safebot'));

    function cols(){ var w=root.clientWidth||360; return clamp(Math.floor(w/118),3,7) }

    function render(){
      // release urls for cells being torn down
      if(io)io.disconnect();
      Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k])}); urls={};
      scroll.textContent='';

      if(!items.length){
        var e=el('div','empty');
        e.innerHTML=G.imageIco+'<h3>No photos yet</h3><p>Import photos and videos from this device. They stay on it — nothing is uploaded.</p>';
        var p=el('button','pill'); p.innerHTML=G.plus+'<span>Import</span>';
        p.addEventListener('click',pick); e.appendChild(p);
        scroll.appendChild(e);
        root.style.setProperty('--phcols',cols());
        return;
      }
      root.style.setProperty('--phcols',cols());

      var groups=[],last=null;
      items.forEach(function(m){
        var k=new Date(m.createdAt).toDateString();
        if(!last||last.k!==k){last={k:k,ts:m.createdAt,list:[]};groups.push(last)}
        last.list.push(m);
      });

      io=new IntersectionObserver(function(ents){
        ents.forEach(function(en){
          if(!en.isIntersecting)return;
          var cell=en.target, id=cell.dataset.id, m=byId(id);
          io.unobserve(cell);
          if(!m||!m.thumb)return;
          var img=cell.querySelector('img'); if(!img)return;
          var u=URL.createObjectURL(m.thumb); urls[id]=u;
          img.onload=function(){img.classList.add('on')};
          img.src=u;
        });
      },{root:scroll,rootMargin:'320px 0px'});

      groups.forEach(function(g){
        var sec=el('div','ph-sec');
        sec.appendChild(el('h4',null,dayHeading(g.ts)));
        var gr=el('div','ph-grid');
        g.list.forEach(function(m){
          var cell=el('button','ph-cell'); cell.dataset.id=m.id;
          cell.setAttribute('aria-label',(m.kind==='video'?'Video':'Photo')+', '+m.name);
          if(m.thumb){ cell.appendChild(el('img')); }
          else { var na=el('div','na'); na.innerHTML=G.imageIco+'<span>Preview unavailable</span>'; cell.appendChild(na) }
          if(m.kind==='video'){
            var b=el('div','badge'); b.innerHTML=G.film+'<span>'+dur(m.duration)+'</span>'; cell.appendChild(b);
          }
          var ck=el('div','check'); ck.innerHTML=G.check; cell.appendChild(ck);
          if(sel[m.id])cell.classList.add('sel');
          gr.appendChild(cell);
          io.observe(cell);
        });
        sec.appendChild(gr); scroll.appendChild(sec);
      });
    }

    function byId(id){ for(var i=0;i<items.length;i++)if(items[i].id===id)return items[i]; return null }

    scroll.addEventListener('click',function(e){
      var cell=e.target.closest('.ph-cell'); if(!cell)return;
      var id=cell.dataset.id;
      if(selecting){
        if(sel[id]){delete sel[id];cell.classList.remove('sel')}else{sel[id]=1;cell.classList.add('sel')}
        var n=Object.keys(sel).length;
        count.textContent=n?(n+' Selected'):'Select Items';
        delBtn.disabled=!n;
      }else{
        openViewer(items.indexOf(byId(id)));
      }
    });

    selBtn.addEventListener('click',function(){
      selecting=!selecting; sel={};
      root.classList.toggle('selecting',selecting);
      selBtn.textContent=selecting?'Cancel':'Select';
      bar.style.display=selecting?'flex':'none';
      count.textContent='Select Items'; delBtn.disabled=true;
      $$('.ph-cell.sel',scroll).forEach(function(c){c.classList.remove('sel')});
    });

    delBtn.addEventListener('click',function(){
      var ids=Object.keys(sel); if(!ids.length)return;
      Promise.all(ids.map(function(id){return DB.del('media',id)})).then(function(){
        items=items.filter(function(m){return ids.indexOf(m.id)<0});
        sel={}; delBtn.disabled=true; count.textContent='Select Items';
        render(); renderPhotosWidget(items);
        api.toast(ids.length+' item'+(ids.length>1?'s':'')+' deleted');
      });
    });

    /* ---- import ---- */
    function pick(){ picker.value=''; picker.click() }
    addBtn.addEventListener('click',pick);

    function onFiles(e){
      var files=Array.prototype.slice.call(e.target.files||[]);
      if(!files.length)return;
      api.toast('Importing '+files.length+' item'+(files.length>1?'s':'')+'…');
      var added=0,failed=0;
      var run=files.reduce(function(p,f){
        return p.then(function(){
          return ingest(f).then(function(rec){ items.unshift(rec); added++; if(!rec.thumb&&!rec.readable)failed++; })
                          .catch(function(){ failed++ });
        });
      },Promise.resolve());
      run.then(function(){
        items.sort(function(a,b){return b.createdAt-a.createdAt});
        render(); renderPhotosWidget(items);
        api.toast(failed? (added+' imported · '+failed+" can't be previewed in this browser") : (added+' item'+(added>1?'s':'')+' imported'));
      });
    }
    picker.addEventListener('change',onFiles);
    this.__detachPicker=function(){picker.removeEventListener('change',onFiles)};

    /* ---- full-screen viewer ---- */
    function openViewer(idx){
      if(idx<0||!items[idx])return;
      var v=el('div','viewer'); viewerState={idx:idx,url:null,node:null};
      var top=el('div','vtop');
      var done=navBtn('Done'); done.style.fontWeight='600';
      var meta=el('div','meta','');
      var trash=el('button','icobtn'); trash.innerHTML=G.trash; trash.setAttribute('aria-label','Delete');
      top.appendChild(done); top.appendChild(meta); top.appendChild(trash);
      var area=el('div','stagearea');
      var prev=el('button','arrow prev'); prev.innerHTML=G.chev; prev.setAttribute('aria-label','Previous');
      var next=el('button','arrow next'); next.innerHTML=G.chevR; next.setAttribute('aria-label','Next');
      var bot=el('div','vbot');
      var info=el('div','meta','');
      bot.appendChild(info);
      v.appendChild(top); v.appendChild(area); v.appendChild(prev); v.appendChild(next); v.appendChild(bot);
      root.appendChild(v);
      requestAnimationFrame(function(){v.classList.add('on')});

      function show(i){
        i=clamp(i,0,items.length-1);
        viewerState.idx=i;
        var m=items[i];
        if(viewerState.url){URL.revokeObjectURL(viewerState.url);viewerState.url=null}
        area.textContent='';
        var d=new Date(m.createdAt);
        meta.textContent=MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate()+', '+d.getFullYear()+' · '+fmtTime(d);
        info.textContent=m.name+' · '+bytes(m.size)+(m.w?(' · '+m.w+'×'+m.h):'');
        var u=URL.createObjectURL(m.blob); viewerState.url=u;
        if(m.kind==='video'){
          var vid=document.createElement('video');
          vid.src=u; vid.controls=true; vid.playsInline=true; vid.autoplay=true; vid.preload='metadata';
          vid.onerror=function(){ area.textContent=''; area.appendChild(unsupported(m)) };
          area.appendChild(vid);
        }else{
          var im=new Image(); im.src=u; im.alt=m.name; im.decoding='async';
          im.onerror=function(){ area.textContent=''; area.appendChild(unsupported(m)) };
          area.appendChild(im);
        }
        prev.style.visibility=i>0?'visible':'hidden';
        next.style.visibility=i<items.length-1?'visible':'hidden';
      }
      function unsupported(m){
        var e=el('div','empty');
        e.innerHTML=G.imageIco+'<h3>This browser can’t open '+(m.name.split('.').pop()||'this file').toUpperCase()+'</h3>'+
          '<p>The file is stored safely and will open in an app that supports the format.</p>';
        return e;
      }
      function close(){
        if(viewerState&&viewerState.url)URL.revokeObjectURL(viewerState.url);
        viewerState=null;
        v.classList.remove('on');
        setTimeout(function(){v.remove()},200);
        document.removeEventListener('keydown',keys);
      }
      function keys(e){
        if(e.key==='ArrowLeft')show(viewerState.idx-1);
        else if(e.key==='ArrowRight')show(viewerState.idx+1);
      }
      document.addEventListener('keydown',keys);
      v.addEventListener('closeviewer',close);
      done.addEventListener('click',close);
      prev.addEventListener('click',function(){show(viewerState.idx-1)});
      next.addEventListener('click',function(){show(viewerState.idx+1)});
      trash.addEventListener('click',function(){
        var m=items[viewerState.idx];
        DB.del('media',m.id).then(function(){
          items=items.filter(function(x){return x.id!==m.id});
          renderPhotosWidget(items);
          if(!items.length){close();render();return}
          var ni=clamp(viewerState.idx,0,items.length-1);
          render(); show(ni);
        });
      });
      area.addEventListener('click',function(e){
        if(e.target.tagName==='VIDEO')return;
        v.classList.toggle('chromeless');
      });
      var sx=null;
      area.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX },{passive:true});
      area.addEventListener('touchend',function(e){
        if(sx==null)return; var dx=e.changedTouches[0].clientX-sx; sx=null;
        if(Math.abs(dx)>52)show(viewerState.idx+(dx<0?1:-1));
      },{passive:true});
      show(idx);
    }

    /* ---- load ---- */
    DB.all('media').then(function(list){
      items=(list||[]).sort(function(a,b){return b.createdAt-a.createdAt});
      render(); renderPhotosWidget(items);
    });

    var ro=new RO(function(){ root.style.setProperty('--phcols',cols()) });
    ro.observe(root);
    this.__cleanup=function(){
      ro.disconnect(); if(io)io.disconnect();
      Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k])});
      if(viewerState&&viewerState.url)URL.revokeObjectURL(viewerState.url);
    };
  },
  unmount:function(){ if(this.__cleanup)this.__cleanup(); if(this.__detachPicker)this.__detachPicker() }
};

      if(isNew)ta.setAttribute('data-autofocus','');
      ed.appendChild(ta);
      var cnt=el('div','nt-count','');
      ed.appendChild(cnt); ed.appendChild(el('div','safebot'));
      root.appendChild(ed);
      if(isNew)setTimeout(function(){ta.focus()},280);

      function stamp(){
        var d=new Date(note.updatedAt);
        cnt.textContent=MONTHS[d.getMonth()]+' '+d.getDate()+', '+fmtTime(d)+(d.getHours()<12?' AM':' PM');
      }
      stamp();
      ta.addEventListener('input',function(){
        note.text=ta.value; note.updatedAt=Date.now(); stamp();
        clearTimeout(saveTimer);
        saveTimer=setTimeout(function(){ DB.put('notes',note) },350);
      });
      trash.addEventListener('click',function(){
        DB.del('notes',note.id).then(function(){
          notes=notes.filter(function(n){return n.id!==note.id});
          closeEditor(); renderList(); api.toast('Note deleted');
        });
      });
      function closeEditor(){
        clearTimeout(saveTimer);
        if((note.text||'').trim()){ DB.put('notes',note) }
        else { notes=notes.filter(function(n){return n.id!==note.id}); DB.del('notes',note.id) }
        notes.sort(function(a,b){return b.updatedAt-a.updatedAt});
        editing=null; ed.remove(); renderList();
      }
      ed.__close=closeEditor;
    }

    DB.all('notes').then(function(list){
      notes=(list||[]).sort(function(a,b){return b.updatedAt-a.updatedAt});
      renderList();
    });
  }
};

var KEYS=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],
          ['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];

function initials(n){
  var p=(n||'?').trim().split(/\s+/);
  return ((p[0]||'')[0]||'?').toUpperCase()+((p[1]||'')[0]||'').toUpperCase();
}
function fmtNumber(v){
  var d=v.replace(/\D/g,'');
  if(v[0]==='+'||d.length>10)return v;
  if(d.length>6)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6,10);
  if(d.length>3)return d.slice(0,3)+'-'+d.slice(3);
  return v;
}

      if(!c)return; open=c;
      var v=el('div','chat'); v.style.cssText='position:absolute;inset:0;background:#000;z-index:5;display:flex;flex-direction:column';

      v.appendChild(el('div','safetop')); v.appendChild(n);

      var head=el('div','chat-head');
      head.innerHTML='<div class="av">'+initials(c.name)+'</div><div class="nm">'+c.name+'</div>';

      bubbles.appendChild(head);
      v.appendChild(bubbles);

      var comp=el('div','composer');
      var ta=document.createElement('textarea'); ta.rows=1; ta.placeholder='Message'; ta.setAttribute('aria-label','Message');
      var send=el('button','send'); send.innerHTML=G.send; send.disabled=true; send.setAttribute('aria-label','Send');
      comp.appendChild(ta); comp.appendChild(send);
      v.appendChild(comp); v.appendChild(el('div','safebot'));
      root.appendChild(v);

      function drawAll(){
        $$('.bub,.daysep',bubbles).forEach(function(x){x.remove()});
        var lastDay=null;
        c.messages.forEach(function(m){
          var d=new Date(m.ts).toDateString();
          if(d!==lastDay){ lastDay=d; bubbles.appendChild(el('div','daysep',dayHeading(m.ts))) }
          bubbles.appendChild(el('div','bub '+(m.me?'me':'you'),m.text));
        });
        bubbles.scrollTop=bubbles.scrollHeight;
      }
      function push(text){
        var prev=c.messages[c.messages.length-1];
        var m={id:uid(),me:true,text:text,ts:Date.now()};
        c.messages.push(m); c.updatedAt=m.ts;
        if(!prev||new Date(prev.ts).toDateString()!==new Date(m.ts).toDateString())
          bubbles.appendChild(el('div','daysep',dayHeading(m.ts)));
        bubbles.appendChild(el('div','bub me',text));
        bubbles.scrollTop=bubbles.scrollHeight;
        DB.put('chats',c);
      }
      function autosize(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,110)+'px' }
      ta.addEventListener('input',function(){ send.disabled=!ta.value.trim(); autosize() });
      ta.addEventListener('keydown',function(e){
        if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>=900){ e.preventDefault(); doSend() }
      });
      function doSend(){
        var t=ta.value.trim(); if(!t)return;
        push(t); ta.value=''; send.disabled=true; autosize();
      }
      send.addEventListener('click',doSend);
      del.addEventListener('click',function(){
        DB.del('chats',c.id).then(function(){
          chats=chats.filter(function(x){return x.id!==c.id});
          open=null; v.remove(); renderList(); api.toast('Conversation deleted');
        });
      });
      drawAll();
      setTimeout(function(){ta.focus()},280);
    }

    DB.all('chats').then(function(l){ chats=l||[]; renderList() });
  }
};

}

/* ------------------------------- passcode -------------------------------- */
/* Stored as a PBKDF2-SHA256 hash with a random salt — never plaintext, never
   logged. This is a privacy screen for a shared device, not encryption: the
   data in IndexedDB stays readable to anyone with the device and devtools.
   Settings says so on screen rather than overstating what this provides. */
var SUBTLE=(window.crypto&&crypto.subtle&&crypto.subtle.deriveBits)?crypto.subtle:null;
var ITER=210000;

function b2a(buf){ return Array.prototype.slice.call(new Uint8Array(buf)) }
function derive(pass,saltArr,iter){
  var enc=new TextEncoder();
  return SUBTLE.importKey('raw',enc.encode(pass),{name:'PBKDF2'},false,['deriveBits'])
    .then(function(k){
      return SUBTLE.deriveBits({name:'PBKDF2',salt:new Uint8Array(saltArr),iterations:iter,hash:'SHA-256'},k,256);
    }).then(b2a);
}
function sameBytes(a,b){
  if(!a||!b||a.length!==b.length)return false;
  var d=0; for(var i=0;i<a.length;i++)d|=a[i]^b[i];
  return d===0;                                   // constant time, no early exit
}
var AUTH={rec:null,loaded:false};
function loadAuth(){
  return DB.get('kv','auth').then(function(r){
    AUTH.rec=(r&&r.hash&&r.salt)?r:null; AUTH.loaded=true; return AUTH.rec;
  });
}
function hasPasscode(){ return !!AUTH.rec }
function setPasscode(pass){
  if(!SUBTLE)return Promise.reject(new Error('unavailable'));
  var salt=b2a(crypto.getRandomValues(new Uint8Array(16)));
  return derive(pass,salt,ITER).then(function(hash){
    var rec={v:1,salt:salt,hash:hash,iter:ITER,updatedAt:Date.now()};
    return DB.put('kv',rec,'auth').then(function(){ AUTH.rec=rec; return true });
  });
}
function clearPasscode(){
  return DB.del('kv','auth').then(function(){ AUTH.rec=null; unlockSession(); return true });
}
function verifyPasscode(pass){
  if(!AUTH.rec||!SUBTLE)return Promise.resolve(false);
  var r=AUTH.rec;
  return derive(pass,r.salt,r.iter||ITER)
    .then(function(h){ return sameBytes(h,r.hash) })
    .catch(function(){ return false });
}
function unlockSession(){ SESSION.setItem('un','1') }
function lockSession(){ SESSION.removeItem('un') }
function sessionUnlocked(){ return SESSION.getItem('un')==='1' }

/* ------------------------------ lock screen ------------------------------ */
var lockFails=0, lockBusy=false;
function showLock(){
  SCREEN='lock';
  var l=$('#lock');
  l.hidden=false;
  requestAnimationFrame(function(){ l.classList.add('on') });
  var i=$('#lockinput'); i.value=''; $('#lockgo').disabled=true;
  setTimeout(function(){ try{i.focus()}catch(e){} },220);
}
function buildLock(){
  var l=$('#lock');
  l.innerHTML='<div class="lockbox">'+
    '<h2>Is Ronaldo 1000th goal target possible?</h2>'+
    '<input id="lockinput" type="password" inputmode="numeric" autocomplete="off" '+
      'enterkeyhint="go" aria-label="Answer" maxlength="32">'+
    '<button id="lockgo" disabled>Continue</button>'+
    '<button class="back" id="lockback">Back to the article</button>'+
    '</div>';
  var input=$('#lockinput'), go=$('#lockgo');
  input.addEventListener('input',function(){
    input.value=input.value.replace(/\D/g,'');
    go.disabled=!input.value||lockBusy;
  });
  input.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!go.disabled)submit() });
  go.addEventListener('click',submit);
  $('#lockback').addEventListener('click',showArticle);

  function submit(){
    if(lockBusy)return;
    var val=input.value; if(!val)return;
    lockBusy=true; go.disabled=true;
    // a small, growing delay blunts rapid guessing without ever blocking forever
    var wait=Math.min(120*Math.pow(2,Math.min(lockFails,5)),4000);
    verifyPasscode(val).then(function(ok){
      input.value='';
      setTimeout(function(){
        lockBusy=false;
        if(ok){ lockFails=0; unlockSession(); showHome(); }
        else{
          // no message, no hint about which part was wrong: it simply
          // returns to the article as though the section never opened
          lockFails++;
          var box=$('.lockbox');
          if(box){ box.classList.add('shake'); setTimeout(function(){box.classList.remove('shake')},360) }
          setTimeout(showArticle,260);
        }
      },ok?0:wait);
    });
  }
}

/* --------------------------- lock / relock hooks -------------------------- */
function lockNow(){
  lockSession();
  if(current)closeApp(true);
  if(hasPasscode())showLock(); else showArticle();
}

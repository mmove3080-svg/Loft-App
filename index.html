REG.calculator={
  title:'Calculator',
  mount:function(api){
    var root=api.root;
    root.appendChild(el('div','safetop'));
    var wrap=el('div','calc-wrap');
    var out=el('div','calc-out','0'); out.setAttribute('aria-live','polite'); out.setAttribute('role','status');
    var keys=el('div','calc-keys');
    wrap.appendChild(out); wrap.appendChild(keys);
    root.appendChild(wrap); root.appendChild(el('div','safebot'));

    var entry='0', acc=null, op=null, fresh=true, err=false, lastRhs=null;

    function fmt(n){
      if(!isFinite(n))return 'Error';
      var neg=n<0; n=Math.abs(n);
      var s;
      if(n!==0&&(n>=1e9||n<1e-6)) s=n.toExponential(5).replace(/e([+-])(\d)$/,'e$10$2');
      else{
        s=String(Math.round(n*1e9)/1e9);
        if(s.indexOf('e')<0){
          var p=s.split('.');
          p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
          s=p.join('.');
        }
      }
      return (neg?'-':'')+s;
    }
    function show(){
      if(err){ out.textContent='Error'; return }
      if(fresh&&acc!==null&&op&&entry==='0'){ out.textContent=fmt(acc); return }
      var t=entry;
      if(t.indexOf('.')<0&&t!=='-'){
        var neg=t[0]==='-'; var d=neg?t.slice(1):t;
        t=(neg?'-':'')+d.replace(/\B(?=(\d{3})+(?!\d))/g,',');
      }else if(t.indexOf('.')>0){
        var q=t.split('.'); var ng=q[0][0]==='-';
        var w=ng?q[0].slice(1):q[0];
        t=(ng?'-':'')+w.replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+q[1];
      }
      out.textContent=t;
      out.style.fontSize=t.length>9?('clamp(28px,'+(15-Math.min(t.length-9,5))+'vw,56px)'):'';
    }
    function digit(d){
      if(err)reset();
      if(fresh){ entry=(d==='.')?'0.':d; fresh=false }
      else{
        if(d==='.'&&entry.indexOf('.')>=0)return;
        if(entry.replace(/[-.]/g,'').length>=9)return;
        entry=(entry==='0'&&d!=='.')?d:entry+d;
      }
      show(); armOp(null);
    }
    function value(){ return parseFloat(entry.replace(/,/g,''))||0 }
    function compute(a,b,o){
      switch(o){
        case '+':return a+b; case '-':return a-b;
        case '×':return a*b; case '÷':return b===0?NaN:a/b;
      }
      return b;
    }
    function setOp(o){
      if(err)return;
      if(op&&!fresh){ var r=compute(acc,value(),op); if(!isFinite(r))return fail(); acc=r; entry=String(acc); show() }
      else if(acc===null||!op) acc=value();
      op=o; fresh=true; lastRhs=null; armOp(o);
    }
    function equals(){
      if(err)return;
      if(op===null)return;
      var rhs = fresh&&lastRhs!==null ? lastRhs : value();
      var r=compute(acc,rhs,op);
      if(!isFinite(r))return fail();
      lastRhs=rhs; acc=r; entry=String(r); fresh=true;
      out.textContent=fmt(r); armOp(null);
      // keep op so pressing = again repeats the operation, as iOS does
    }
    function fail(){ err=true; acc=null; op=null; fresh=true; entry='0'; show(); armOp(null) }
    function reset(){ err=false; acc=null; op=null; lastRhs=null; entry='0'; fresh=true; show(); armOp(null); acLabel() }
    function clearEntry(){ entry='0'; fresh=true; err=false; show(); acLabel() }
    function sign(){ if(err)return; entry=entry[0]==='-'?entry.slice(1):('-'+entry); if(entry==='-0')entry='0'; show() }
    function percent(){ if(err)return; var v=value()/100; entry=String(v); fresh=false; show() }
    function armOp(o){
      $$('.ck.op',keys).forEach(function(b){ b.classList.toggle('armed',!!o&&b.dataset.k===o) });
    }
    function acLabel(){
      var b=keys.querySelector('[data-k="AC"]');
      if(b)b.textContent=(entry!=='0'&&!fresh)||err?'C':'AC';
    }

    var LAYOUT_K=[
      ['AC','top'],['+/−','top'],['%','top'],['÷','op'],
      ['7',''],['8',''],['9',''],['×','op'],
      ['4',''],['5',''],['6',''],['−','op'],
      ['1',''],['2',''],['3',''],['+','op'],
      ['0','zero'],['.',''],['=','op']
    ];
    LAYOUT_K.forEach(function(k){
      var b=el('button','ck'+(k[1]?' '+k[1]:''),k[0]);
      var key=k[0]==='−'?'-':k[0];
      b.dataset.k=key; b.setAttribute('aria-label',k[0]);
      keys.appendChild(b);
    });

    keys.addEventListener('click',function(e){
      var b=e.target.closest('.ck'); if(!b)return;
      var k=b.dataset.k;
      if(/^[0-9.]$/.test(k))digit(k);
      else if(k==='AC'){ b.textContent==='C'?clearEntry():reset() }
      else if(k==='+/−')sign();
      else if(k==='%')percent();
      else if(k==='=')equals();
      else setOp(k==='-'?'-':k);
      acLabel();
    });

    function onKey(e){
      if(!current||current.id!=='calculator')return;
      var k=e.key;
      if(/^[0-9]$/.test(k))digit(k);
      else if(k==='.'||k===',')digit('.');
      else if(k==='+'||k==='-')setOp(k==='-'?'-':'+');
      else if(k==='*'||k==='x'||k==='X')setOp('×');
      else if(k==='/')setOp('÷');
      else if(k==='%')percent();
      else if(k==='Enter'||k==='=')equals();
      else if(k==='Backspace'){
        if(err||fresh)return;
        entry=entry.length>1?entry.slice(0,-1):'0';
        if(entry==='-')entry='0';
        show();
      }
      else if(k==='Escape'){ reset(); e.stopPropagation() }
      else return;
      acLabel(); e.preventDefault();
    }
    document.addEventListener('keydown',onKey,true);
    this.__off=function(){ document.removeEventListener('keydown',onKey,true) };
    show(); acLabel();
  },
  unmount:function(){ if(this.__off)this.__off() }
};

/* ==========================================================================
   boot: dock/grid icons, then article -> passcode -> home
   ========================================================================== */
$('#ico-calc').innerHTML=ICON.calculator;
$('#ico-set').innerHTML=ICON.settings;

stage.style.visibility='hidden';
buildArticle();
buildLock();
Promise.all([loadPrefs(),loadAuth()]).then(function(){
  showArticle();          // the article is always the first screen
});

})();

</script>
